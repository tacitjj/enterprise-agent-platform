name: Feature request
description: Propose an improvement with a clear architecture boundary
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Which user or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the observable outcome without prescribing unnecessary implementation detail.
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security and architecture boundaries
      description: Note impacts on tenant isolation, authorization, task state, billing, contracts, or runtime safety.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and the roadmap.
          required: true
