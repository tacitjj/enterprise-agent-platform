name: Bug report
description: Report a reproducible defect in the reference implementation
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private data, or unpatched vulnerability details. Use the private security process for vulnerabilities.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Java control plane
        - Python runtime boundary
        - React web application
        - Contracts
        - Local deployment
        - Documentation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible sequence, sanitized logs, and the relevant commit.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and relevant Java, Python, Node.js, Docker, or browser versions.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed secrets and private data.
          required: true
