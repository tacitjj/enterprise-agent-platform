name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test all Maven modules
        run: mvn --batch-mode --no-transfer-progress -f dianlian-platform/pom.xml test

  web:
    name: React / Node.js 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dianlian-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dianlian-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:sites

  python:
    name: FastAPI / Python 3.12
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dianlian-ai-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: dianlian-ai-runtime/uv.lock
      - run: uv sync --frozen --group deerflow-h0
      - run: uv run python -m pytest
