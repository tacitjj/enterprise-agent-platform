    CreateTaskRequest:
      type: object
      additionalProperties: false
      required:
        - goal
        - collaborationMode
        - targetAgentIds
        - ownership
        - maxPointCost
        - capabilityInput
      properties:
        sourceConversationId:
          oneOf:
            - $ref: "#/components/schemas/StableId"
            - type: "null"
        sourceMessageId:
          oneOf:
            - $ref: "#/components/schemas/StableId"
            - type: "null"
        expectedMembershipVersion:
          type: [string, "null"]
          maxLength: 128
          description: 群任务必须提交；事务提交前按权威成员版本再次校验。
        goal:
          type: string
          minLength: 1
          maxLength: 5000
        constraints:
          type: array
          maxItems: 100
          items:
            type: string
            minLength: 1
            maxLength: 1000
        inputRefs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/InputReference"
        collaborationMode:
          $ref: "#/components/schemas/CollaborationMode"
        targetAgentIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            $ref: "#/components/schemas/StableId"
        primaryAgentId:
          oneOf:
            - $ref: "#/components/schemas/StableId"
            - type: "null"
          description: PRIMARY_SUMMARY 必填，且必须包含在 targetAgentIds 中；其他模式必须为空。
        ownership:
          $ref: "#/components/schemas/TaskOwnership"
        maxPointCost:
          $ref: "#/components/schemas/PointValue"
        capabilityInput:
          $ref: "#/components/schemas/CapabilityInput"
        desiredArtifactType:
          type: [string, "null"]
          maxLength: 64
      allOf:
        - if:
            properties:
              collaborationMode:
                const: SINGLE_TARGET
          then:
            properties:
              targetAgentIds:
                maxItems: 1
              primaryAgentId:
                type: "null"
        - if:
            properties:
              collaborationMode:
                const: PARALLEL_SEPARATE
          then:
            properties:
              targetAgentIds:
                minItems: 2
              primaryAgentId:
                type: "null"
        - if:
            properties:
              collaborationMode:
                const: PRIMARY_SUMMARY
          then:
            required: [primaryAgentId]
            properties:
              targetAgentIds:
                minItems: 2
              primaryAgentId:
                $ref: "#/components/schemas/StableId"
    CapabilityInput:
      type: object
      additionalProperties: false
      required: [schemaId, schemaVersion, values]
      description: |
        由目标员工版本声明并在服务端校验的结构化能力输入。平台内核只保存版本化输入快照，
        不按报价、合同或出图在 Task 核心中增加专属字段。
      properties:
        schemaId:
          type: string
          pattern: "^[a-z][a-z0-9_.-]{1,127}$"
        schemaVersion:
          type: string
          minLength: 1
          maxLength: 64
        values:
          type: object
          additionalProperties: true
          maxProperties: 200
    InputReference:
      type: object
      additionalProperties: false
      required: [refType, refId, version]
      properties:
        refType:
          type: string
          enum: [MESSAGE, ATTACHMENT, ARTIFACT, KNOWLEDGE_DOCUMENT, BUSINESS_OBJECT]
        refId:
          $ref: "#/components/schemas/StableId"
        version:
          type: string
          minLength: 1
          maxLength: 128
    TaskOwnership:
      type: object
      additionalProperties: false
      required: [ownerUserId, billingScopeType, billingScopeId]
      properties:
        ownerUserId:
          $ref: "#/components/schemas/StableId"
        projectId:
          oneOf:
            - $ref: "#/components/schemas/StableId"
            - type: "null"
        billingScopeType:
          type: string
          enum: [TENANT, DEPARTMENT, USER, TASK]
        billingScopeId:
          $ref: "#/components/schemas/StableId"
    CollaborationMode:
      type: string
      enum: [SINGLE_TARGET, PARALLEL_SEPARATE, PRIMARY_SUMMARY]

    TaskCommandAccepted:
      type: object
      additionalProperties: false
      required: [taskId, taskVersion, status, acceptedAt, statusUrl, eventsUrl, resumeEventId]
      properties:
        taskId:
